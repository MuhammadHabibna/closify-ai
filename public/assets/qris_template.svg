<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440" width="340" height="440">
  <defs>
    <linearGradient id="qrisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="320" height="420" rx="16" fill="url(#qrisGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top Header with Red Accent -->
  <path d="M 10 26 Q 10 10 26 10 L 314 10 Q 330 10 330 26 L 330 65 L 10 65 Z" fill="#b91c1c" />

  <!-- QRIS Official Header Text -->
  <text x="170" y="42" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">QRIS</text>
  <text x="170" y="56" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="8" font-weight="700" fill="#fecaca" text-anchor="middle" letter-spacing="1">QR CODE INDONESIAN STANDARD</text>

  <!-- Merchant Name -->
  <text x="170" y="90" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">ARUNIKA APPAREL INDONESIA</text>
  <text x="170" y="106" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">NMID: ID1020261948291 • SURABAYA</text>

  <!-- QR Frame Container -->
  <rect x="50" y="125" width="240" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Simulated QR Pattern Matrix -->
  <!-- Top Left Finder Pattern -->
  <rect x="68" y="143" width="54" height="54" rx="6" fill="#0f172a"/>
  <rect x="76" y="151" width="38" height="38" rx="3" fill="#ffffff"/>
  <rect x="84" y="159" width="22" height="22" rx="2" fill="#0f172a"/>

  <!-- Top Right Finder Pattern -->
  <rect x="218" y="143" width="54" height="54" rx="6" fill="#0f172a"/>
  <rect x="226" y="151" width="38" height="38" rx="3" fill="#ffffff"/>
  <rect x="234" y="159" width="22" height="22" rx="2" fill="#0f172a"/>

  <!-- Bottom Left Finder Pattern -->
  <rect x="68" y="293" width="54" height="54" rx="6" fill="#0f172a"/>
  <rect x="76" y="301" width="38" height="38" rx="3" fill="#ffffff"/>
  <rect x="84" y="309" width="22" height="22" rx="2" fill="#0f172a"/>

  <!-- Decorative QR Data Points -->
  <g fill="#0f172a">
    <!-- Center block -->
    <rect x="135" y="145" width="10" height="18"/>
    <rect x="155" y="145" width="18" height="10"/>
    <rect x="185" y="145" width="12" height="25"/>
    <rect x="135" y="175" width="25" height="10"/>
    <rect x="170" y="175" width="10" height="15"/>
    <rect x="190" y="180" width="14" height="14"/>

    <!-- Middle matrix -->
    <rect x="135" y="205" width="15" height="15"/>
    <rect x="160" y="200" width="20" height="12"/>
    <rect x="190" y="205" width="15" height="20"/>
    <rect x="70" y="210" width="20" height="10"/>
    <rect x="100" y="210" width="12" height="15"/>
    <rect x="220" y="210" width="20" height="10"/>
    <rect x="250" y="205" width="15" height="20"/>

    <!-- Lower middle matrix -->
    <rect x="135" y="235" width="25" height="12"/>
    <rect x="170" y="230" width="12" height="25"/>
    <rect x="190" y="240" width="20" height="10"/>
    <rect x="70" y="235" width="15" height="15"/>
    <rect x="95" y="240" width="20" height="12"/>
    <rect x="220" y="235" width="12" height="25"/>
    <rect x="245" y="240" width="25" height="10"/>

    <!-- Bottom right quadrant -->
    <rect x="135" y="265" width="12" height="20"/>
    <rect x="155" y="270" width="25" height="12"/>
    <rect x="190" y="265" width="15" height="20"/>
    <rect x="215" y="275" width="20" height="12"/>
    <rect x="245" y="265" width="15" height="20"/>

    <rect x="135" y="295" width="20" height="12"/>
    <rect x="165" y="300" width="15" height="25"/>
    <rect x="190" y="295" width="22" height="12"/>
    <rect x="220" y="300" width="14" height="14"/>
    <rect x="245" y="295" width="25" height="12"/>

    <rect x="135" y="325" width="25" height="10"/>
    <rect x="170" y="330" width="15" height="15"/>
    <rect x="195" y="320" width="20" height="20"/>
    <rect x="225" y="325" width="20" height="15"/>
    <rect x="255" y="320" width="15" height="20"/>
  </g>

  <!-- GPN / ASPI Footer Logos -->
  <g transform="translate(45, 382)">
    <!-- GPN Badge -->
    <rect x="0" y="0" width="70" height="22" rx="4" fill="#f1f5f9"/>
    <text x="35" y="15" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="9" font-weight="800" fill="#dc2626" text-anchor="middle">GPN</text>

    <!-- Supported By text -->
    <text x="125" y="14" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">BCA • Mandiri • GoPay • ShopeePay</text>

    <!-- BI Logo Indicator -->
    <rect x="180" y="0" width="70" height="22" rx="4" fill="#0f172a"/>
    <text x="215" y="14" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">BANK INDONESIA</text>
  </g>
</svg>
